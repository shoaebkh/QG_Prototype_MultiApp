name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds the shell with every app bundled - the broadest compile
      # check available without picking one subset over another.
      - run: npm run build:all

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Builds every module (common, events, sales/service/analytics-service,
      # api-gateway) in one reactor run from the aggregator pom.
      - run: mvn -B clean package
        working-directory: backend

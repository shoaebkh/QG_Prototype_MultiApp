server:
  port: 8081

app:
  service-url: ${SERVICE_SERVICE_URL:http://localhost:8082}

spring:
  application:
    name: sales-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ERP_Prototype}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Tables (lead, case_record) are created explicitly, not by
      # Hibernate - validate confirms the entity mapping still matches
      # instead of silently altering a shared database.
      ddl-auto: validate
    show-sql: true

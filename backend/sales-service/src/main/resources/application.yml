server:
  port: 8081

app:
  service-url: ${SERVICE_SERVICE_URL:http://localhost:8082}

spring:
  application:
    name: sales-service
  datasource:
    url: jdbc:h2:mem:salesdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

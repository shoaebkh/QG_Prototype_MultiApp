server:
  port: 8082

spring:
  application:
    name: service-service
  datasource:
    url: jdbc:h2:mem:servicedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
